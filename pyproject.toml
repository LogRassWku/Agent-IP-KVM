[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ip-kvm"
version = "0.1.0"
description = "Portable software core for Agent IP KVM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.scripts]
agent-ip-kvm-video = "agent_ip_kvm.cli:main"
agent-ip-kvm-web = "agent_ip_kvm.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_ip_kvm = ["web_assets/*"]
