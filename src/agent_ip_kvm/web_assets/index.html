<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Agent IP KVM</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar" id="topbar">
      <button class="agent-mode-button" id="agent-mode-button" type="button" aria-pressed="false" title="切换到 Agent 模式">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 13.8 8l4.7 1.8-4.7 1.8L12 16l-1.8-4.4-4.7-1.8L10.2 8 12 3.5Z"/><path d="m18.3 15 .8 2.1 2.2.9-2.2.8-.8 2.2-.9-2.2-2.1-.8 2.1-.9.9-2.1Z"/></svg>
        <span>Agent</span>
      </button>
      <nav class="tools" aria-label="视频工具栏">
        <button class="tool-button" id="refresh-button" type="button" title="刷新状态">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-14.9-4L3 9m0 0V4m0 5h5M4 13a8.1 8.1 0 0 0 14.9 4L21 15m0 0v5m0-5h-5"/></svg>
          <span>刷新</span>
        </button>
        <div class="tool-menu" id="mouse-tool-menu">
          <button class="tool-button" id="mouse-button" type="button" title="鼠标设置" aria-expanded="false" aria-controls="mouse-menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="6"/><path d="M12 2.5V9M9 9h6"/></svg>
            <span>鼠标</span>
          </button>
          <section class="popover-menu mouse-menu" id="mouse-menu" aria-label="鼠标设置" hidden>
            <label for="cursor-size-select">画面内光标大小</label>
            <select id="cursor-size-select">
              <option value="small">小</option>
              <option value="medium" selected>中</option>
              <option value="large">大</option>
            </select>
            <p class="mouse-message" id="mouse-message" role="status" aria-live="polite">正在读取 HID 状态</p>
            <p class="control-hint">鼠标移入视频画面后，位置、点击和滚轮会自动同步到目标电脑。</p>
          </section>
        </div>
        <button class="tool-button" id="keyboard-button" type="button" title="屏幕键盘" aria-expanded="false" aria-controls="onscreen-keyboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M6.5 9h.01M10.2 9h.01M13.8 9h.01M17.5 9h.01M6.5 12h.01M10.2 12h.01M13.8 12h.01M17.5 12h.01M7 15.5h10"/></svg>
          <span>键盘</span>
        </button>
        <div class="tool-menu">
          <button class="tool-button" id="screen-button" type="button" title="屏幕设置" aria-expanded="false" aria-controls="screen-menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="3.5" width="19" height="14" rx="2"/><path d="M8 21h8M12 17.5V21"/></svg>
            <span>屏幕</span>
          </button>
          <section class="popover-menu screen-menu" id="screen-menu" aria-label="屏幕设置" hidden>
            <label for="resolution-select">分辨率</label>
            <select id="resolution-select"></select>
            <label for="refresh-rate-select">刷新率</label>
            <select id="refresh-rate-select"></select>
            <p class="screen-message" id="screen-message" aria-live="polite"></p>
            <button class="apply-button" id="apply-screen-settings" type="button">应用</button>
          </section>
        </div>
        <button class="tool-button" id="settings-button" type="button" title="设备信息" aria-expanded="false" aria-controls="settings-panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
          <span>设置</span>
        </button>
      </nav>
    </header>

    <main class="workspace" id="workspace">
      <section class="agent-shell mode-panel" id="agent-shell" aria-label="Agent 对话界面" aria-hidden="true">
        <div class="agent-chat">
          <header class="agent-heading">
            <span class="agent-orb" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3.5 13.8 8l4.7 1.8-4.7 1.8L12 16l-1.8-4.4-4.7-1.8L10.2 8 12 3.5Z"/><path d="m18.3 15 .8 2.1 2.2.9-2.2.8-.8 2.2-.9-2.2-2.1-.8 2.1-.9.9-2.1Z"/></svg>
            </span>
            <div>
              <p>Agent 模式</p>
              <h1>想让我帮你操作什么？</h1>
            </div>
          </header>

          <div class="agent-conversation" id="agent-conversation" aria-live="polite">
            <article class="agent-message assistant-message">
              <span class="message-avatar" aria-hidden="true">A</span>
              <div>
                <strong>Agent</strong>
                <p>我可以观察被控电脑并协助执行任务。涉及安装、BIOS 或系统修改时，会先向你说明操作并等待允许。</p>
              </div>
            </article>
          </div>

          <div class="agent-suggestions" aria-label="快捷指令">
            <button type="button" data-agent-prompt="检查当前电脑的状态">检查电脑状态</button>
            <button type="button" data-agent-prompt="分析屏幕上正在显示的错误">分析屏幕错误</button>
            <button type="button" data-agent-prompt="帮我规划系统镜像安装步骤">规划镜像安装</button>
          </div>

          <form class="agent-composer" id="agent-composer">
            <textarea id="agent-input" rows="1" maxlength="2000" placeholder="向 Agent 描述任务…" aria-label="向 Agent 描述任务"></textarea>
            <button id="agent-send" type="submit" title="发送" aria-label="发送消息">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7M12 5v14"/></svg>
            </button>
          </form>
          <p class="agent-disclaimer">Agent 执行接口尚未连接；当前阶段用于确认交互和界面结构。</p>
        </div>
      </section>

      <section class="video-shell mode-panel" id="video-shell" aria-label="视频画面">
        <img class="video-frame" id="video-frame" alt="KVM 视频画面">
        <div class="no-signal" id="no-signal" role="status" aria-live="polite">
          <span class="signal-dot" aria-hidden="true"></span>
          <span>No Signal</span>
        </div>
        <div class="zoom-buttons" aria-label="画面缩放">
          <button id="zoom-out" type="button" title="缩小画面" aria-label="缩小画面">−</button>
          <button id="zoom-in" type="button" title="放大画面" aria-label="放大画面">+</button>
        </div>
      </section>
    </main>

    <section class="onscreen-keyboard" id="onscreen-keyboard" aria-label="屏幕键盘" hidden>
      <div class="keyboard-heading">
        <div>
          <strong>屏幕键盘</strong>
          <span id="hid-message" role="status" aria-live="polite">正在读取 HID 状态</span>
        </div>
        <div class="keyboard-actions">
          <button id="release-keys" type="button">释放全部</button>
          <button class="icon-button" id="close-keyboard" type="button" title="关闭屏幕键盘" aria-label="关闭屏幕键盘">×</button>
        </div>
      </div>
      <div class="keyboard-rows" id="keyboard-rows">
        <div class="keyboard-row compact-row">
          <button class="keyboard-key" data-key="escape">Esc</button>
          <button class="keyboard-key" data-key="f1">F1</button><button class="keyboard-key" data-key="f2">F2</button><button class="keyboard-key" data-key="f3">F3</button><button class="keyboard-key" data-key="f4">F4</button>
          <button class="keyboard-key" data-key="f5">F5</button><button class="keyboard-key" data-key="f6">F6</button><button class="keyboard-key" data-key="f7">F7</button><button class="keyboard-key" data-key="f8">F8</button>
          <button class="keyboard-key" data-key="f9">F9</button><button class="keyboard-key" data-key="f10">F10</button><button class="keyboard-key" data-key="f11">F11</button><button class="keyboard-key" data-key="f12">F12</button>
          <button class="keyboard-key" data-key="delete">Del</button>
        </div>
        <div class="keyboard-row">
          <button class="keyboard-key" data-key="`">`</button><button class="keyboard-key" data-key="1">1</button><button class="keyboard-key" data-key="2">2</button><button class="keyboard-key" data-key="3">3</button><button class="keyboard-key" data-key="4">4</button><button class="keyboard-key" data-key="5">5</button><button class="keyboard-key" data-key="6">6</button><button class="keyboard-key" data-key="7">7</button><button class="keyboard-key" data-key="8">8</button><button class="keyboard-key" data-key="9">9</button><button class="keyboard-key" data-key="0">0</button><button class="keyboard-key" data-key="-">−</button><button class="keyboard-key" data-key="=">=</button><button class="keyboard-key wide" data-key="backspace">Backspace</button>
        </div>
        <div class="keyboard-row">
          <button class="keyboard-key wide" data-key="tab">Tab</button><button class="keyboard-key" data-key="q">Q</button><button class="keyboard-key" data-key="w">W</button><button class="keyboard-key" data-key="e">E</button><button class="keyboard-key" data-key="r">R</button><button class="keyboard-key" data-key="t">T</button><button class="keyboard-key" data-key="y">Y</button><button class="keyboard-key" data-key="u">U</button><button class="keyboard-key" data-key="i">I</button><button class="keyboard-key" data-key="o">O</button><button class="keyboard-key" data-key="p">P</button><button class="keyboard-key" data-key="[">[</button><button class="keyboard-key" data-key="]">]</button><button class="keyboard-key" data-key="\">\</button>
        </div>
        <div class="keyboard-row">
          <button class="keyboard-key wide" data-key="capslock">Caps</button><button class="keyboard-key" data-key="a">A</button><button class="keyboard-key" data-key="s">S</button><button class="keyboard-key" data-key="d">D</button><button class="keyboard-key" data-key="f">F</button><button class="keyboard-key" data-key="g">G</button><button class="keyboard-key" data-key="h">H</button><button class="keyboard-key" data-key="j">J</button><button class="keyboard-key" data-key="k">K</button><button class="keyboard-key" data-key="l">L</button><button class="keyboard-key" data-key=";">;</button><button class="keyboard-key" data-key="'">'</button><button class="keyboard-key extra-wide" data-key="enter">Enter</button>
        </div>
        <div class="keyboard-row">
          <button class="keyboard-key modifier extra-wide" data-modifier="shift">Shift</button><button class="keyboard-key" data-key="z">Z</button><button class="keyboard-key" data-key="x">X</button><button class="keyboard-key" data-key="c">C</button><button class="keyboard-key" data-key="v">V</button><button class="keyboard-key" data-key="b">B</button><button class="keyboard-key" data-key="n">N</button><button class="keyboard-key" data-key="m">M</button><button class="keyboard-key" data-key=",">,</button><button class="keyboard-key" data-key=".">.</button><button class="keyboard-key" data-key="/">/</button><button class="keyboard-key modifier extra-wide" data-modifier="shift">Shift</button>
        </div>
        <div class="keyboard-row bottom-row">
          <button class="keyboard-key modifier" data-modifier="ctrl">Ctrl</button><button class="keyboard-key modifier" data-modifier="win">Win</button><button class="keyboard-key modifier" data-modifier="alt">Alt</button><button class="keyboard-key space-key" data-key="space">Space</button><button class="keyboard-key" data-key="left">←</button><button class="keyboard-key" data-key="up">↑</button><button class="keyboard-key" data-key="down">↓</button><button class="keyboard-key" data-key="right">→</button>
        </div>
      </div>
    </section>

    <div class="panel-backdrop" id="panel-backdrop" hidden></div>
    <aside class="settings-panel" id="settings-panel" aria-hidden="true" aria-label="设备信息">
      <div class="panel-header">
        <div>
          <span class="eyebrow">设置</span>
          <h2>设备信息</h2>
        </div>
        <button class="icon-button" id="close-settings" type="button" title="关闭设置" aria-label="关闭设置">×</button>
      </div>

      <section class="info-section">
        <h3>当前视频源</h3>
        <dl class="info-list">
          <div><dt>后端</dt><dd id="info-backend">--</dd></div>
          <div><dt>来源</dt><dd id="info-source">--</dd></div>
          <div><dt>状态</dt><dd id="info-health">--</dd></div>
          <div><dt>格式</dt><dd id="info-format">--</dd></div>
          <div><dt>分辨率</dt><dd id="info-resolution">--</dd></div>
          <div><dt>帧率</dt><dd id="info-fps">--</dd></div>
          <div><dt>错误</dt><dd id="info-error">无</dd></div>
        </dl>
      </section>

      <section class="info-section">
        <div class="section-title-row">
          <h3>已发现的设备</h3>
          <span id="device-count">0</span>
        </div>
        <p class="muted" id="v4l2-message">正在读取设备信息</p>
        <div class="device-list" id="device-list"></div>
      </section>
    </aside>

    <script src="/app.js"></script>
  </body>
</html>
